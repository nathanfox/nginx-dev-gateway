# ============================================
# HEADER-BASED ROUTING
#
# Use Case: Route requests based on headers for
# testing, debugging, or multi-tenancy
# ============================================

# ============================================
# Debug Mode Routing
# Route to debug version when X-Debug header is present
# ============================================

location /api/payment/ {
    set $payment_upstream payment-service.default.svc.cluster.local:8080;

    # Override with debug version if header is present
    if ($http_x_debug = "true") {
        set $payment_upstream payment-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    }

    proxy_pass http://$payment_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# ============================================
# Tenant-Based Routing
# Route to different services based on tenant ID
# ============================================

location /api/data/ {
    set $data_upstream data-service.default.svc.cluster.local:8080;

    # Route to tenant-specific service
    if ($http_x_tenant_id = "acme") {
        set $data_upstream data-service-acme.default.svc.cluster.local:8080;
    }
    if ($http_x_tenant_id = "globex") {
        set $data_upstream data-service-globex.default.svc.cluster.local:8080;
    }

    proxy_pass http://$data_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# ============================================
# A/B Testing
# Route to different service versions for testing
# ============================================

location /api/search/ {
    set $search_upstream search-service.default.svc.cluster.local:8080;

    # A/B testing based on header
    if ($http_x_experiment = "new-algorithm") {
        set $search_upstream search-service-v2.default.svc.cluster.local:8080;
    }

    proxy_pass http://$search_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# ============================================
# Environment Override
# Allow testing against different environments
# ============================================

location /api/users/ {
    set $users_upstream user-service.default.svc.cluster.local:8080;

    # Override environment based on header
    if ($http_x_env = "staging") {
        set $users_upstream user-service.staging.svc.cluster.local:8080;
    }
    if ($http_x_env = "dev") {
        set $users_upstream user-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    }

    proxy_pass http://$users_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# ============================================
# Mock Mode
# Return mock responses for testing
# ============================================

location /api/external/ {
    # Return mock response if X-Mock header is present
    if ($http_x_mock = "true") {
        add_header Content-Type application/json;
        return 200 '{"status": "success", "data": {"id": 123, "message": "This is a mock response"}}';
    }

    # Otherwise proxy to real service
    set $external_upstream external-service.default.svc.cluster.local:8080;
    proxy_pass http://$external_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# ============================================
# Canary Deployment
# Route percentage of traffic to new version
# ============================================

location /api/orders/ {
    set $orders_upstream order-service.default.svc.cluster.local:8080;

    # Force canary version with header
    if ($http_x_canary = "true") {
        set $orders_upstream order-service-canary.default.svc.cluster.local:8080;
    }

    proxy_pass http://$orders_upstream/;
    include /etc/nginx/includes/proxy.conf;
}