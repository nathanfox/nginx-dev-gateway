# ============================================
# ALL STABLE SERVICES CONFIGURATION
#
# Use Case: Quick baseline configuration with all
# services using stable versions from default namespace
# ============================================

# ============================================
# All services from default namespace (stable)
# ============================================

# user-service
location /api/users/ {
    set $users_upstream user-service.default.svc.cluster.local:8080;
    proxy_pass http://$users_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

