# ============================================
# MIXED LOCAL AND CLUSTER SERVICES
#
# Use Case: Running some services locally on your
# machine while others are in the cluster
# ============================================

# ============================================
# Local services (running on your machine)
# ============================================

# frontend - RUNNING LOCALLY (e.g., React dev server)
# Access via host.docker.internal when gateway is in Docker/K8s
location / {
    proxy_pass http://host.docker.internal:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# backend API - RUNNING LOCALLY (e.g., Node.js on port 4000)
location /api/local/ {
    proxy_pass http://host.docker.internal:4000/;
    include /etc/nginx/includes/proxy.conf;
}

# ============================================
# Services in your namespace (debugging)
# ============================================

# payment-service - YOUR DEBUG VERSION IN CLUSTER
location /api/payment/ {
    set $payment_upstream payment-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    proxy_pass http://$payment_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# ============================================
# Stable services (in default namespace)
# ============================================

# user-service - STABLE VERSION
location /api/users/ {
    set $users_upstream user-service.default.svc.cluster.local:8080;
    proxy_pass http://$users_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# order-service - STABLE VERSION
location /api/orders/ {
    set $orders_upstream order-service.default.svc.cluster.local:8080;
    proxy_pass http://$orders_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# database-api - STABLE VERSION
location /api/db/ {
    set $db_upstream database-api.default.svc.cluster.local:8080;
    proxy_pass http://$db_upstream/;
    include /etc/nginx/includes/proxy.conf;
}