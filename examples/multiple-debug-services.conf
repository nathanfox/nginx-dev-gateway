# ============================================
# MULTIPLE SERVICES DEBUG CONFIGURATION
#
# Use Case: You're debugging integration between
# payment-service and order-service
# ============================================

# ============================================
# Services being debugged (in your namespace)
# ============================================

# payment-service - YOUR DEBUG VERSION
location /api/payment/ {
    set $payment_upstream payment-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    proxy_pass http://$payment_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# order-service - YOUR DEBUG VERSION
location /api/orders/ {
    set $orders_upstream order-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    proxy_pass http://$orders_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# ============================================
# Stable services (in default namespace)
# ============================================

# user-service - STABLE VERSION
location /api/users/ {
    set $users_upstream user-service.default.svc.cluster.local:8080;
    proxy_pass http://$users_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

