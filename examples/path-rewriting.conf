# ============================================
# PATH REWRITING EXAMPLES
#
# Use Case: Services that need URL path transformation
# ============================================

# ============================================
# Path Rewriting Examples
# ============================================

# Strip prefix - Remove /svc/billing from path
# /svc/billing/invoice/123 → /invoice/123
location ~ ^/svc/billing/(.*)$ {
    set $billing_upstream billing-service.${CURRENT_NAMESPACE}.svc.cluster.local:3000;
    proxy_pass http://$billing_upstream/$1$is_args$args;
    include /etc/nginx/includes/proxy.conf;
}

# Add prefix - Add /api to backend path
# /users/123 → /api/users/123
location ~ ^/users/(.*)$ {
    set $users_upstream user-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    proxy_pass http://$users_upstream/api/users/$1$is_args$args;
    include /etc/nginx/includes/proxy.conf;
}

# Version routing - Route based on API version
# /v1/orders → order-service-v1
# /v2/orders → order-service-v2
location ~ ^/v1/orders/(.*)$ {
    set $orders_v1_upstream order-service-v1.default.svc.cluster.local:8080;
    proxy_pass http://$orders_v1_upstream/orders/$1$is_args$args;
    include /etc/nginx/includes/proxy.conf;
}

location ~ ^/v2/orders/(.*)$ {
    set $orders_v2_upstream order-service-v2.default.svc.cluster.local:8080;
    proxy_pass http://$orders_v2_upstream/orders/$1$is_args$args;
    include /etc/nginx/includes/proxy.conf;
}

# Dynamic service routing based on path
# /service/payment/... → payment-service
# /service/user/... → user-service
location ~ ^/service/([a-z]+)/(.*)$ {
    set $service_name $1-service;
    set $service_path $2;
    set $dynamic_upstream $service_name.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    proxy_pass http://$dynamic_upstream/$service_path$is_args$args;
    include /etc/nginx/includes/proxy.conf;
}

# Legacy API compatibility
# Map old endpoints to new services
location /legacy/getUserInfo {
    set $users_upstream user-service.default.svc.cluster.local:8080;
    proxy_pass http://$users_upstream/api/users/profile;
    include /etc/nginx/includes/proxy.conf;
}

location /legacy/getOrderStatus {
    set $orders_upstream order-service.default.svc.cluster.local:8080;
    proxy_pass http://$orders_upstream/api/orders/status;
    include /etc/nginx/includes/proxy.conf;
}

# GraphQL endpoint consolidation
# All GraphQL queries go to the GraphQL gateway
location /graphql {
    set $graphql_upstream graphql-gateway.default.svc.cluster.local:4000;
    proxy_pass http://$graphql_upstream/graphql;
    include /etc/nginx/includes/proxy.conf;

    # GraphQL subscriptions (WebSocket)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}