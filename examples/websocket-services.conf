# ============================================
# WEBSOCKET-ENABLED SERVICES
#
# Use Case: Services that use WebSocket connections
# for real-time communication
# ============================================

# ============================================
# WebSocket Services
# ============================================

# Notification service with WebSocket support
location /ws/notifications {
    set $ws_notif_upstream notification-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    proxy_pass http://$ws_notif_upstream/;

    # WebSocket specific headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;

    # Long timeouts for persistent connections
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
}

# Chat service with WebSocket
location /ws/chat {
    set $ws_chat_upstream chat-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    proxy_pass http://$ws_chat_upstream/;
    include /etc/nginx/includes/websocket.conf;
}

# Real-time dashboard updates
location /ws/dashboard {
    set $ws_dash_upstream dashboard-service.default.svc.cluster.local:8080;
    proxy_pass http://$ws_dash_upstream/;
    include /etc/nginx/includes/websocket.conf;
}

# Socket.io specific routing (commonly used WebSocket library)
location /socket.io/ {
    set $socketio_upstream realtime-service.${CURRENT_NAMESPACE}.svc.cluster.local:3000;
    proxy_pass http://$socketio_upstream/socket.io/;
    include /etc/nginx/includes/websocket.conf;
}

# ============================================
# Regular HTTP Services
# ============================================

# API endpoints for the notification service
location /api/notifications/ {
    set $notif_upstream notification-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    proxy_pass http://$notif_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# API endpoints for the chat service
location /api/chat/ {
    set $chat_upstream chat-service.${CURRENT_NAMESPACE}.svc.cluster.local:8080;
    proxy_pass http://$chat_upstream/;
    include /etc/nginx/includes/proxy.conf;
}

# Dashboard API
location /api/dashboard/ {
    set $dash_upstream dashboard-service.default.svc.cluster.local:8080;
    proxy_pass http://$dash_upstream/;
    include /etc/nginx/includes/proxy.conf;
}