apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  labels:
    app: nginx-gateway
    component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
        component: proxy
    spec:
      containers:
      - name: nginx
        image: nginx-dev-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: CURRENT_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NGINX_WORKER_PROCESSES
          value: "auto"
        - name: NGINX_WORKER_CONNECTIONS
          value: "1024"
        - name: LOG_LEVEL
          value: "info"
        - name: PROXY_CONNECT_TIMEOUT
          value: "60s"
        - name: PROXY_SEND_TIMEOUT
          value: "60s"
        - name: PROXY_READ_TIMEOUT
          value: "60s"
        volumeMounts:
        - name: routes-config
          mountPath: /etc/nginx/routes
          readOnly: true
        - name: cache
          mountPath: /var/cache/nginx
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        # Note: Security context removed temporarily due to permission issues
        # TODO: Fix Dockerfile to properly support running as non-root
      volumes:
      - name: routes-config
        configMap:
          name: nginx-gateway-routes
          optional: true
      - name: cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}